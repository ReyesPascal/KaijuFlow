name: KaijuFlow CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-unit-test:
    name: Build and unit tests (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build, unit tests, test type-check, brain tools (npm run check, the same command agents run)
        run: npm run check
      - name: Working tree is clean after build and tests
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
