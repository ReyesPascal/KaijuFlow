# Test copies of the one setup a run plays (#185): KaijuFlow and its AltMount copy (spec #58, ticket #60).
# The test copies of the runs before #185 (uu-test, nzbdav-test, altmount-addon-test) are no longer set up here (#187);
# they stay stopped, with their config folders, in ${TEST_DIR}.
# Own compose project, container names, network and config folders: no compose command on this
# file can reach a live container (usenet-ultimate, nzbdav, altmount-altmount-1, ds-xml-proxy).
# Config folders hold secrets and live outside the repo in ${TEST_DIR}.
# Run with:  docker compose --env-file ~/kaijuflow-test/.env -f tools/brain/compose.test.yaml <command>
name: kaijuflow-test

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-host: &host
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # KaijuFlow side (1338), Backend = altmount-kf (8087)
  kaijuflow:
    <<: *host
    image: kaijuflow:test
    container_name: kaijuflow-test
    environment:
      BASE_URL: http://${HOST_IP:?set HOST_IP in the test folder .env}:1338
      PORT: "1337"
    ports: ["1338:1337"]
    volumes: ["${TEST_DIR:?}/config:/app/config"]
    restart: "no"
    mem_limit: 2g
    networks: [net]
    logging: *logging

  # KaijuFlow's own AltMount (8087)
  altmount-kf:
    <<: *host
    image: ghcr.io/kipsilabs/altmount:v0.4.0
    container_name: altmount-kf-test
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Chicago
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the test folder .env}
      COOKIE_DOMAIN: localhost
    ports: ["8087:8080"]
    volumes: ["${TEST_DIR:?}/altmount-kf/config:/config"]
    restart: "no"
    mem_limit: 2g
    networks: [net]
    logging: *logging

networks:
  net:
    name: kaijuflow-test-net
